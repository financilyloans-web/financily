services:
  - type: web
    name: financily-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - {key: NODE_ENV, value: production}
      - {key: MONGODB_URI, sync: false}
      - {key: CLIENT_ORIGIN, sync: false}
      - {key: JWT_SECRET, generateValue: true}
      - {key: ADMIN_USER, sync: false}
      - {key: ADMIN_PASS, sync: false}
